<!DOCTYPE html>
<html lang="en">

<head>
   <title>Contact | Ol' Toy Bench</title>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">
   <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>

   <!-- start header -->
   <header>
      <h1><a href="index.html">Ol' Toy Bench</a></h1>
      <p>a second life for timeless toys</p>

      <!-- navigation -->
      <nav>
         <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
         </ul>
      </nav>
   </header>
   <!-- end header -->

   <!-- start main content -->
   <main>

      <!-- contact form section -->
      <section id="contact-form">
         <h2>Contact us</h2>
         <form>
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" placeholder="e.g. johndoe@mail.com" required>

            <label for="phone">Phone *</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. +32 489 44 33 22" required>

            <label for="message">Message *</label>
            <textarea id="message" name="message" placeholder="Write your message..." required></textarea>

            <button type="submit">Submit</button>
         </form>
      </section>

      <!-- map and contact info -->
      <section id="contact-info">
         <h2>Find us</h2>

         <!-- google map -->
         <iframe src="https://www.google.com/maps?q=Brooklyn,NY&output=embed" width="400" height="300"></iframe>

         <!-- contact details -->
         <ul>
            <li><span class="material-symbols-outlined">location_on</span> 1224 Park Pl, Brooklyn, NY 11213</li>
            <li><span class="material-symbols-outlined">call</span> +1 800 559 6580</li>
            <li><span class="material-symbols-outlined">mail</span> mail@demonlink.org</li>
         </ul>
      </section>

   </main>
   <!-- end main content -->

   <!-- start footer -->
   <footer>
      <p>OTS © 2045 | Privacy Policy | Design by <a href="http://www.templatemonster.com/">FreeTemplates.com</a></p>
      <ul>
         <li><a href="#" title="send us an email"><img src="img/icon-mail.png" alt="icon mail"></a></li>
         <li><a href="#" title="follow us on rss"><img src="img/icon-rss.png" alt="icon rss"></a></li>
         <li><a href="#" title="tweet about us"><img src="img/icon-twitter.png" alt="icon twitter"></a></li>
      </ul>
   </footer>
   <!-- end footer -->

</body>
</html>
